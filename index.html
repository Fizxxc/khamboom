<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Peledakan Bom</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            overflow: hidden;
        }
        .bomb-container {
            position: relative;
            margin: 50px auto;
            width: 220px;
        }
        .bomb {
            width: 200px;
            height: 100px;
            background: gray;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border: 5px solid black;
            box-shadow: 0px 0px 10px red;
        }
        .wires {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .wire {
            width: 80px;
            height: 10px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .wire:hover {
            transform: scale(1.1);
        }
        .red { background: red; }
        .blue { background: blue; }
        .green { background: green; }
        .explosion {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://media.giphy.com/media/xT9IgzoKnwFNmISR8I/giphy.gif') center/cover;
            z-index: 9999;
        }
        .block-input {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            opacity: 0.8;
            z-index: 10000;
            display: none;
        }
        .error-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 50px;
            font-weight: bold;
            z-index: 10001;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Hitung Mundur Peledakan Bom</h1>
    <div class="bomb-container">
        <div class="bomb" id="timer">10</div>
    </div>
    <div class="wires">
        <div class="wire red" onclick="cutWire('red')"></div>
        <div class="wire blue" onclick="cutWire('blue')"></div>
        <div class="wire green" onclick="cutWire('green')"></div>
    </div>
    <div class="explosion" id="explosion"></div>
    <div class="block-input" id="blockInput"></div>
    <div class="error-text" id="errorText">SYSTEM FAILURE!</div>

    <script>
        let timeLeft = 10;
        let bombTimer = setInterval(() => {
            document.getElementById("timer").textContent = timeLeft;
            if (timeLeft === 0) {
                clearInterval(bombTimer);
                document.getElementById("timer").style.display = "none";
                document.getElementById("explosion").style.display = "block";
                document.getElementById("blockInput").style.display = "block";
                document.getElementById("errorText").style.display = "block";
                document.body.style.pointerEvents = "none";
                Swal.fire("BOOM!", "Ledakan di rumahmu sudah terjadi, bijaklah dalam permainan kawan.", "error");
            }
            timeLeft--;
        }, 100);

        const correctWire = "blue";
        function cutWire(color) {
            if (color === correctWire) {
                clearInterval(bombTimer);
                Swal.fire("Selamat!", "Anda berhasil menjinakkan bom!", "success");
            } else {
                Swal.fire("Salah!", "Kabel ini bukan yang benar!", "warning");
            }
        }
    </script>
</body>
</html>
